<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up to Coopers Social</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Coopers">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        body { margin: 0; background-color: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .box { width: 100%; max-width: 350px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Join Coopers Social</h1>
        <input type="text" placeholder="Username">
        <input type="email" placeholder="Email address">
        <input type="password" placeholder="Password">
        <button>Sign Up</button>
        <p class="footer">By signing up, you agree to our Terms.</p>
    </div>
</body>
<script>
  async function initApp() {
    // 1. Fetch your API settings
    const response = await fetch('api.json');
    const config = await response.json();
    
    // 2. Initialize Supabase (Ensure you have the CDN link in your <head>)
    const supabase = supabase.createClient(config.supabaseUrl, config.supabaseKey);

    // 3. Example: Sign Up Function
    window.signUp = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) alert(error.message);
      else alert('Check your email for confirmation!');
    };
  }
  initApp();
</script>
</html>
